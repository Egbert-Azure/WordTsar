<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.url }}/screenshots/ws-look-block-menu.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="titlebar">
    <div class="wrap">
      <a class="name" href="./">WordTsar for macOS</a>
      <nav aria-label="Sections">
        <a href="#features">Features</a>
        <a href="#install">Install</a>
        <a href="#credits">Credits</a>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="statusbar">
    <div class="wrap">
      <p>macOS fork maintained by {{ site.author }}. WordTsar was created by Gerald Brandt.</p>
      <p>Source code under the <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE.md">GNU AGPL v3.0</a></p>
    </div>
  </footer>

  <script src="assets/site.js" defer></script>
</body>
</html>
